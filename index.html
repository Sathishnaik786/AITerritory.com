<!DOCTYPE html>
<html lang="en">
  <head>
    
    <!-- Google AdSense -->
    <script type="module">

    <script type="module">
      if (import.meta.env.VITE_CLARITY_ID) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

        })(window, document, "clarity", "script", import.meta.env.VITE_CLARITY_ID);

      }
    </script>
    <!-- End Microsoft Clarity -->
    
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Add critical CSS here to prevent layout shift */
      #root {
        min-height: 100vh;
      }
      
      /* Hide content until styles are loaded to prevent flash */
      .no-fouc {
        opacity: 0;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
      }
      
      /* Basic loading styles */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 1.2rem;
      }
      
      /* Ensure smooth transition when showing content */
      body:not(.no-fouc) {
        opacity: 1;
        transition: opacity 0.3s ease-in-out;
      }
    </style>
    
    <!-- Canonical URL for SEO -->
    <link rel="canonical" href="https://aiterritory.org/" />
    
    <title>AI Territory - Discover AI Tools, Prompts & Resources</title>
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body class="no-fouc">
    <div id="root">
      <!-- Loading indicator -->
      <div class="loading">Loading AI Territory...</div>
    </div>
    <script type="module">
      // Remove FOUC class when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.remove('no-fouc');
      });
      
      // Also remove FOUC when window loads (fallback)
      window.addEventListener('load', function() {
        document.body.classList.remove('no-fouc');
      });
      
      // Immediate removal if styles are already loaded
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        document.body.classList.remove('no-fouc');
      }
      
      // Testing block
      try {
        console.log("[AITerritory] GTM Loaded:", !!(import.meta && import.meta.env && import.meta.env.VITE_GTM_ID));
        console.log("[AITerritory] Google Ads Injection:", !!(import.meta && import.meta.env && import.meta.env.VITE_GADS_CONV_ID));
        console.log("[AITerritory] Meta Pixel Forwarding:", !!(import.meta && import.meta.env && import.meta.env.VITE_META_PIXEL_ID));
        console.log("[AITerritory] Clarity Detection:", !!(import.meta && import.meta.env && import.meta.env.VITE_CLARITY_ID));
        console.log("[AITerritory] AdSense Loaded:", !!(import.meta && import.meta.env && import.meta.env.VITE_ADSENSE_ID));
      } catch (e) {
        console.log("[AITerritory] Environment variables not available");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
