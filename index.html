<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Add critical CSS here to prevent layout shift */
      #root {
        min-height: 100vh;
      }
      
      /* Hide content until styles are loaded to prevent flash */
      .no-fouc {
        opacity: 0;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
      }
      
      /* Basic loading styles */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 1.2rem;
      }
      
      /* Ensure smooth transition when showing content */
      body:not(.no-fouc) {
        opacity: 1;
        transition: opacity 0.3s ease-in-out;
      }
    </style>
    
    <!-- Canonical URL for SEO -->
    <link rel="canonical" href="https://aiterritory.org/" />
    
    <title>AI Territory - Discover AI Tools, Prompts & Resources</title>
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body class="no-fouc">
    <div id="root">
      <!-- Loading indicator -->
      <div class="loading">Loading AI Territory...</div>
    </div>
    <script>
      // Remove FOUC class when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.remove('no-fouc');
      });
      
      // Also remove FOUC when window loads (fallback)
      window.addEventListener('load', function() {
        document.body.classList.remove('no-fouc');
      });
      
      // Immediate removal if styles are already loaded
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        document.body.classList.remove('no-fouc');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
