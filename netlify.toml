# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' 
        https://clerk.aiterritory.org 
        https://*.clerk.accounts.dev 
        https://js.stripe.com 
        https://www.googletagmanager.com 
        https://www.google-analytics.com
        https://www.youtube.com
        https://s.ytimg.com;
      style-src 'self' 'unsafe-inline' 
        https://fonts.googleapis.com 
        https://cdn.jsdelivr.net;
      font-src 'self' 
        https://fonts.gstatic.com 
        https://cdn.jsdelivr.net
        data:;
      img-src 'self' 
        data: 
        https: 
        blob: 
        https://*.supabase.co
        https://aiterritory-com.onrender.com
        https://www.google-analytics.com
        https://www.googletagmanager.com;
      connect-src 'self' 
        https://aiterritory-com.onrender.com 
        https://clerk.aiterritory.org 
        https://*.clerk.accounts.dev 
        https://api.stripe.com 
        wss://*.clerk.accounts.dev 
        https://ckahkadgnaxzcfhmsdaj.supabase.co 
        wss://ckahkadgnaxzcfhmsdaj.supabase.co 
        https://www.google-analytics.com 
        https://www.googletagmanager.com
        https://sentry.io;
      frame-src 
        https://js.stripe.com 
        https://www.youtube.com 
        https://www.youtube-nocookie.com
        https://clerk.aiterritory.org
        https://*.clerk.accounts.dev;
      worker-src 'self' blob:;
      media-src 'self' 
        https://aiterritory-com.onrender.com
        https://ckahkadgnaxzcfhmsdaj.supabase.co;
    """

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/(.*).(js|css|webp|svg|jpg|jpeg|png|woff2|woff|ttf|eot)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SEO Redirects - Force canonical domain (https://aiterritory.org/)
[[redirects]]
  from = "http://aiterritory.org/*"
  to = "https://aiterritory.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.aiterritory.org/*"
  to = "https://aiterritory.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aiterritory.org/*"
  to = "https://aiterritory.org/:splat"
  status = 301
  force = true

# Redirects for removed fallback pages
[[redirects]]
  from = "/resources/best-ai-3d-generators"
  to = "/"
  status = 301

[[redirects]]
  from = "/company/update-tool"
  to = "/"
  status = 301

[[redirects]]
  from = "/company/skill-leap"
  to = "/"
  status = 301

# Redirect /contact to /company/contact-us
[[redirects]]
  from = "/contact"
  to = "/company/contact-us"
  status = 301

# Handle SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle 404s
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
