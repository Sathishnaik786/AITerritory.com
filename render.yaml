services:
  - name: ai-territory
    type: web
    plan: free
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # IMPORTANT: Set these in your Render environment variables with your actual production keys from Clerk dashboard
      # Never commit real production keys to your repository
      # These are just placeholder values - replace with your actual keys in Render dashboard
